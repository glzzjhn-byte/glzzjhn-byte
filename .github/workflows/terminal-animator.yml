name: Generate Animated Terminal

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:       

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PRORFILE_SUMMARY_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate SVG
        run: python generate_terminal.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add system_terminal_v3.svg
          git commit -m "Update animated terminal (v3)" || exit 0
          git push
